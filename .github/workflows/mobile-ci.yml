name: Mobile TypeScript CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Verify source-grounded native recipe import and explicit publication
        run: node --test scripts/check-mobile-recipe-import.test.cjs
      - name: Stop stalled recipe publishing and avoid duplicate writes
        run: node --test scripts/check-mobile-recipe-publish.test.cjs
      - name: Guard native manual recipe creation, editing and image upload
        run: node --test scripts/check-mobile-manual-recipes.test.cjs
      - name: Guard native manual recipe edit moderation and approval states
        run: node --test scripts/check-mobile-recipe-edit-review.test.cjs
      - name: Guard global create sheet and restored recipe discovery feed
        run: node --test scripts/check-mobile-global-create-sheet.test.cjs
      - name: Quick recipe/pantry UX and profile-only quota displays
        run: node --test scripts/check-quick-create-quota-ux.test.cjs
      - name: Check owner-verified Tariflerim and Sofralarım paging
        run: node --test scripts/check-mobile-my-kitchen-library.test.cjs
      - name: Review premium recipe checklist and import editor accessibility
        run: node --test scripts/check-mobile-recipe-editorial.test.cjs
      - name: Guard full-bleed recipe hero and compact rating and reaction controls
        run: node --test scripts/check-mobile-recipe-hero-reactions.test.cjs
      - name: Guard editable AI recipe preview and user-approved publish
        run: node --test scripts/check-quick-ai-review.test.cjs
      - name: Guard shared recipe editor UX, curated units and numeric ranges
        run: node --test scripts/check-recipe-editor-parity-ux.test.cjs
      - name: Protect recipe edits and support existing Turkish ingredient amounts
        run: node --test scripts/check-legacy-ingredient-edit-auth.test.cjs
      - name: Typecheck Expo React Native project
        run: npx tsc --noEmit
      - name: Check recommended Expo native dependency versions
        run: npx expo install --check
        env:
          CI: '1'
      - name: Lint Xcode 27 local simulator installer shell syntax
        run: bash -n scripts/ios-simulator-local-build.sh
      - name: Lint generated CocoaPods minimum deployment repair
        run: node --check scripts/ios-xcode27-pods-min-target.cjs
      - name: Guard local cooking assistant speech and timer boundaries
        run: node --test scripts/check-cooking-assistant.test.cjs scripts/check-tts-voices.test.cjs scripts/check-chirp3-voice.test.cjs scripts/check-cooking-commands.test.cjs scripts/check-dev-build-variant.test.cjs
      - name: Verify semantic Lokma food emoji, ratings and comment reactions
        run: node --test scripts/check-lokma-emoji.test.cjs
      - name: Lokma ingredient resolution matches the web resolver
        run: node --test scripts/check-lokma-resolution.test.cjs
      - name: Shopping list sums only unambiguous amounts
        run: node --test scripts/check-shopping-list.test.cjs
      - name: Redesign foundation (tokens, fonts, floating tabs, honest social metrics)
        run: node --test scripts/check-mobile-redesign-foundation.test.cjs
      - name: Recipes, menus and blog archives; social source card
        run: node --test scripts/check-mobile-archive-screens.test.cjs
      - name: Paylaş → Tariften, icon set, splash and safe iOS rebuild
        run: node --test scripts/check-share-to-tariften.test.cjs
      - name: Verify mobile membership, servings and profile navigation parity
        run: node --test scripts/check-mobile-content-parity.test.cjs
      - name: Kitchen profile flow, allergen consent and sign-in after registration
        run: node --test scripts/check-kitchen-profile.test.cjs
      - name: Bu Hafta / Alışveriş three-way merge and account sync
        run: node --test scripts/check-kitchen-sync.test.cjs
      - name: Recipe allergen band and AI allergen conflict handling
        run: node --test scripts/check-allergen-ui.test.cjs
      - name: Push + in-app notifications (routing, never-on-launch permission, token lifecycle)
        run: node --test scripts/check-notifications.test.cjs
      - name: Mutfak Rehberi (API mapping, TOC, callouts, tables, video cards, routes)
        run: node --test scripts/check-kitchen-guide.test.cjs
      - name: Guard Expo Router URI parsing compatibility
        run: node --test scripts/check-router-uri-surface.test.cjs
      - name: Verify xcode PBX ids (xcode@4 without uuid, or patched uuid for xcode@3)
        run: node --test scripts/check-xcode-uuid.test.cjs
      - name: Report production dependency security advisories
        run: npm audit --omit=dev --json > npm-audit-production.json
        continue-on-error: true
      - name: Summarize production dependency advisories
        if: always()
        run: |
          node -e 'const fs=require("fs");if(!fs.existsSync("npm-audit-production.json")){console.log("No npm audit report");process.exit(0)}const r=JSON.parse(fs.readFileSync("npm-audit-production.json","utf8"));console.log("Runtime audit:",JSON.stringify(r.metadata?.vulnerabilities??{}));for(const [name,item] of Object.entries(r.vulnerabilities??{})){if(["high","critical"].includes(item.severity))console.log(item.severity.toUpperCase(),name,"fixAvailable:",JSON.stringify(item.fixAvailable));}'
      - name: Preserve production audit report for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-production-npm-audit
          path: npm-audit-production.json
          if-no-files-found: warn
          retention-days: 30

      - name: Reject critical advisories or missing audit evidence
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'npm-audit-production.json';
          let report;
          try {
            report = JSON.parse(fs.readFileSync(file, 'utf8'));
          } catch (error) {
            console.error('Security gate: audit report unavailable or invalid:', error.message);
            process.exit(1);
          }
          const totals = report.metadata?.vulnerabilities;
          const critical = totals?.critical;
          if (!totals || !Number.isInteger(critical) || critical < 0 || !report.vulnerabilities || typeof report.vulnerabilities !== 'object') {
            console.error('Security gate: audit failed or returned an incomplete report.');
            process.exit(1);
          }
          const listedCritical = Object.values(report.vulnerabilities).filter(item => item.severity === 'critical');
          console.log('Production dependency tree audit:', JSON.stringify(totals));
          if (critical > 0 || listedCritical.length > 0) {
            console.error('Security gate failed: critical advisories:', listedCritical.map(item => item.name).join(', ') || critical);
            process.exit(1);
          }
          console.log('Security gate passed: no critical advisories. High/moderate findings remain tracked.');
          NODE
      - name: Reject new high advisories and audit count regressions
        if: always()
        run: |
          node --test scripts/check-audit-regressions.test.cjs
          node scripts/check-audit-regressions.cjs npm-audit-production.json
      - name: Reject unreviewed GitHub Security Advisory IDs
        if: always()
        run: |
          node --test scripts/check-known-advisories.test.cjs
          node scripts/check-known-advisories.cjs npm-audit-production.json
