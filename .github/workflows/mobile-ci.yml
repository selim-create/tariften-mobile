name: Mobile TypeScript CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Typecheck Expo React Native project
        run: npx tsc --noEmit
      - name: Check recommended Expo native dependency versions
        run: npx expo install --check
        continue-on-error: true
        env:
          CI: '1'
      - name: Report production dependency security advisories
        run: npm audit --omit=dev --json > npm-audit-production.json
        continue-on-error: true
      - name: Preserve production audit report for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-production-npm-audit
          path: npm-audit-production.json
          if-no-files-found: warn
          retention-days: 30

